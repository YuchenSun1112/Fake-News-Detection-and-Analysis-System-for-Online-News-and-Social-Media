[project]
name = "fact-based-news-verification"
version = "0.1.0"
description = "A Streamlit prototype for fact-based news verification with baseline classification, claim extraction, evidence retrieval, and claim verification."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=0.30",
    "datasets>=2.19",
    "numpy>=1.24",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "safetensors>=0.4",
    "scikit-learn>=1.3",
    "sentencepiece>=0.2",
    "streamlit>=1.34",
    "tomli>=2.0; python_version < '3.11'",
    "torch==2.11.0+cu128",
    "transformers>=4.46,<5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[tool.uv]
cache-dir = ".tmp/uv-cache"
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.fact_news]
max_length = 256
top_k_claims = 5
top_k_evidence = 5
request_timeout = 15
baseline_model_name = "bert-base-uncased"
gnews_endpoint = "https://gnews.io/api/v4/search"
supported_weight = 1.0
refuted_weight = 1.2
nei_weight = 0.4
baseline_prior_weight = 0.25

[tool.fact_news.claim_extractor]
mode = "model"
model = "google/flan-t5-base"
min_sent_words = 5
min_claim_words = 4
max_claim_words = 36
max_input_chars_per_sent = 700
max_new_tokens = 96
max_input_chars_per_summary_chunk = 900
max_summary_chunks = 4
min_summary_chunk_chars = 220
max_retrieval_summaries_per_chunk = 3
max_claims_per_sentence = 4
dedup_sim_threshold = 0.82

[tool.fact_news.retriever]
max_query_candidates = 5
early_stop_article_count = 10
max_gnews_query_words = 10
max_gnews_query_chars = 190
gnews_direct_sentence_query = false
gnews_sortby_order = ["relevance", "publishedAt"]
gnews_search_fields = "title,description,content"
gnews_results_per_query = 12
min_evidence_score = 0.22
min_keyword_match = 0.20
gnews_max_retries = 3
gnews_retry_base_delay = 2.0
evidence_cache_max_size = 200

[tool.fact_news.nli]
model = "MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli"
max_length = 512
max_evidence = 5
decision_threshold = 0.55
nei_margin = 0.08

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.6",
]
